<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Contáctanos! | CyA English Academy</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 430px;
            margin: 50px auto;
            background: rgba(255,255,255,0.95);
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(80, 80, 140, 0.13);
            padding: 35px 24px 22px 24px;
        }
        h1 {
            text-align: center;
            color: #764ba2;
            margin-bottom: 9px;
        }
        .intro {
            text-align: center;
            color: #333;
            margin-bottom: 18px;
            font-size: 1.04em;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }
        label {
            font-weight: 600;
            margin-bottom: 5px;
        }
        .campo {
            display: flex;
            align-items: center;
            gap: 9px;
        }
        input[type="text"], input[type="email"], textarea {
            border: 1.8px solid #ceb3ee;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 1em;
            background: #f6f2ff;
            resize: vertical;
            flex: 1;
        }
        textarea {
            min-height: 65px;
        }
        .feedback {
            color: green;
            font-size: 0.91em;
            margin-top: 4px;
            display: none;
        }
        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 0;
            font-size: 1.08em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 2px 6px #ceb3ee3b;
            transition: background 0.3s, transform 0.15s;
        }
        .btn:hover {
            background: linear-gradient(45deg, #764ba2, #667eea);
            transform: scale(1.04);
        }
        .aviso {
            font-size: 0.92em;
            color: #888;
            margin-top: 9px;
        }
        .icono {
            font-size: 1.3em;
        }
        @media (max-width: 600px) {
            .container { padding: 18px 3vw; }
        }
    </style>
    <script>
        function mostrarFeedback(id, valido) {
            const feedback = document.getElementById(id);
            if(valido) {
                feedback.style.display = "inline";
            } else {
                feedback.style.display = "none";
            }
        }
        function validarNombre() {
            const nombre = document.getElementById('nombre').value.trim();
            mostrarFeedback('okNombre', nombre.length > 1);
        }
        function validarCorreo() {
            const correo = document.getElementById('email').value.trim();
            mostrarFeedback('okCorreo', /^[^@]+@[^@]+\.[a-zA-Z]{2,}$/.test(correo));
        }
        function validarMensaje() {
            const mensaje = document.getElementById('mensaje').value.trim();
            mostrarFeedback('okMensaje', mensaje.length > 2);
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>¡Contáctanos!</h1>
        <div class="intro">
            ¿Tienes una duda, sugerencia o quieres saludarnos?<br>
            ¡Completa este formulario y te responderemos pronto!
        </div>
        <form action="https://formspree.io/f/mqabvyva" method="POST" autocomplete="on">
            <div class="campo">
                <span class="icono" aria-hidden="true">👦</span>
                <label for="nombre">¿Cómo te llamas?</label>
            </div>
            <div class="campo">
                <input type="text" id="nombre" name="nombre" required maxlength="60" placeholder="Escribe tu nombre aquí" oninput="validarNombre()">
                <span class="feedback" id="okNombre">✔️</span>
            </div>
            <div class="campo">
                <span class="icono" aria-hidden="true">📧</span>
                <label for="email">¿Cuál es tu correo?</label>
            </div>
            <div class="campo">
                <input type="email" id="email" name="email" required maxlength="60" placeholder="ejemplo@email.com" oninput="validarCorreo()">
                <span class="feedback" id="okCorreo">✔️</span>
            </div>
            <div class="campo">
                <span class="icono" aria-hidden="true">📝</span>
                <label for="mensaje">¿Qué nos quieres contar?</label>
            </div>
            <div class="campo">
                <textarea id="mensaje" name="mensaje" required maxlength="800" placeholder="¡Cuéntanos tu duda o mensaje!" oninput="validarMensaje()"></textarea>
                <span class="feedback" id="okMensaje">✔️</span>
            </div>
            <div style="margin: 7px 0;">
                <input type="checkbox" id="privacidad" name="privacidad" required>
                <label for="privacidad" style="font-size:0.97em;">
                    He leído y acepto la <a href="politica-privacidad.html" target="_blank">política de privacidad</a>.
                </label>
            </div>
            <button type="submit" class="btn">¡Enviar mi mensaje!</button>
        </form>
        <div class="aviso">
            * Si eres menor de edad, pide ayuda a un adulto para enviar este mensaje.<br>
            * Todos los campos son obligatorios.
        </div>
    </div>
</body>
</html>
